# Free demonstration deployment. Free instances use ephemeral storage;
# active rooms will not survive an instance restart or redeployment.
# For persistent games, use a paid instance with a persistent disk and
# configure GAME_DB to that disk's path, or migrate persistence to Postgres.
services:
  - type: web
    name: the-last-candle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
